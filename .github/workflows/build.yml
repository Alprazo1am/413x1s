name: Build AntiNotch
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Unzip project
        run: unzip -q AntiNotch-theos.zip

      - name: Build
        working-directory: AntiNotch
        run: make package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: AntiNotch-deb
          path: AntiNotch/packages/*.deb
